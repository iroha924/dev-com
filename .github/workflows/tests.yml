name: tests
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # 会社の PC と同じ Windows PowerShell 5.1 で、PowerShell が要るテストを飛ばさずに流す
  windows:
    runs-on: windows-2025
    env:
      DEV_COM_EXPECT_POWERSHELL: "5.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # PR では merge commit ではなく PR の先端を確かめる（CI が見たコミットと変えたコミットを揃える）
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: versions
        run: |
          git rev-parse HEAD
          python --version
          powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: tests
        run: python -m unittest discover -s tests -v
  # PowerShell 7 で、POSIX でだけ流す install.ps1 の試験を含めて流す
  ubuntu:
    runs-on: ubuntu-24.04
    env:
      DEV_COM_REQUIRE_POWERSHELL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: versions
        run: |
          git rev-parse HEAD
          python --version
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: tests
        run: python -m unittest discover -s tests -v
      - name: a wrong PowerShell version stops the tests
        run: |
          set +e
          DEV_COM_EXPECT_POWERSHELL=5.1 python -m unittest tests.test_ado_ps1 > wrong-version.log 2>&1
          code=$?
          cat wrong-version.log
          test "$code" -ne 0 && grep -q "PowerShell の版が違う" wrong-version.log
